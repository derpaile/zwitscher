<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173f36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Zwitscher – das Hörspiel für heimische Vogelstimmen."
    />
    <title>Zwitscher · Vogelstimmen hören lernen</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐦</text></svg>" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="forest" aria-hidden="true">
      <span class="glow"></span>
      <span class="leaf leaf-a"></span>
      <span class="leaf leaf-b"></span>
      <span class="leaf leaf-c"></span>
      <span class="leaf leaf-d"></span>
      <span class="leaf leaf-e"></span>
    </div>

    <main class="app-shell">
      <header class="topbar">
        <button class="brand" id="home-button" aria-label="Zur Startseite">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 36 36"><path d="M9.3 21.2c1.8 5.5 8.6 8.1 14 4.3 3.9-2.5 4.9-7.5 2.5-11.2-2.2-3.5-6.7-5-10.6-3.5-2.8 1.1-4.8 3.4-5.6 6.1L4 20.2l5.3 1Z"/><circle cx="22.5" cy="14.5" r="1.35"/><path class="beak" d="m27.1 15.5 5.4 2-5.5 1.7Z"/></svg>
          </span>
          <span>zwitscher</span>
        </button>

        <nav class="top-actions" aria-label="Hauptnavigation">
          <button class="nav-button" id="stats-button">
            <span aria-hidden="true">↗</span>
            <span class="nav-label">Fortschritt</span>
          </button>
          <button class="nav-button" id="journal-button">
            <span aria-hidden="true">＋</span>
            <span class="nav-label">Sichtungen</span>
          </button>
          <button class="nav-button" id="collection-button">
            <span aria-hidden="true">◉</span>
            <span class="nav-label">Vogelbuch</span>
          </button>
          <button class="sound-button" id="sound-button" aria-label="Ton ausschalten" aria-pressed="false">
            <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 8.5c1.7 1.6 1.7 5.4 0 7M18.5 6c3.3 3.2 3.3 8.8 0 12"/></svg>
            <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 5 5m0-5-5 5"/></svg>
          </button>
          <button class="sound-button" id="settings-button" aria-label="Einstellungen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5A3.5 3.5 0 1 0 12 15a3.5 3.5 0 0 0 0-7Z" fill="none"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" fill="none"/></svg>
          </button>
        </nav>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
    <script src="game.js"></script>
  </body>
</html>
